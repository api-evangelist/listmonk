description: >-
  FinOps view of running listmonk. The software itself is free and open-source
  (AGPLv3) with no license or per-message fee from the project. Total cost of
  ownership is therefore driven entirely by self-hosting infrastructure
  (compute, the PostgreSQL database, object storage for media, bandwidth) and
  by the third-party SMTP / email-delivery provider used for outbound sends,
  which typically bills per-thousand or per-million emails. There is no
  listmonk invoice to reconcile; costs appear on cloud-infrastructure and
  email-provider bills.
notes: >-
  Because listmonk has no vendor billing, FinOps practice focuses on the
  underlying hosting provider and email transport provider. Right-size the
  server and database, watch object-storage and egress for media, and choose
  an SMTP provider tier matched to send volume.
