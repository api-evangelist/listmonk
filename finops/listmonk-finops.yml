meters:
- name: compute_hours
  description: Server / container hours running the listmonk binary, billed by the hosting provider.
  unit: hours
  aggregation: sum
  dimensions:
  - account
  - host
- name: database_hours
  description: PostgreSQL database hours / instance cost backing listmonk.
  unit: hours
  aggregation: sum
  dimensions:
  - account
  - host
- name: object_storage
  description: Storage (local disk or S3-compatible) for uploaded media files.
  unit: gigabytes
  aggregation: sum
  dimensions:
  - account
  - bucket
- name: bandwidth
  description: Egress bandwidth for serving media, public pages, and tracking pixels.
  unit: gigabytes
  aggregation: sum
  dimensions:
  - account
- name: emails_sent
  description: Outbound emails billed by the downstream SMTP / delivery provider (e.g. SES, SendGrid).
  unit: messages
  aggregation: sum
  dimensions:
  - account
  - provider
principles:
- name: Visibility
  description: Track the hosting and email-provider bills; listmonk itself emits no charges.
- name: Allocation
  description: Tag the server, database, storage, and SMTP account so listmonk costs map to a cost center.
- name: Optimization
  description: Right-size compute and Postgres, use a cost-effective SMTP tier for the send volume, and prune media/object storage.
- name: Accountability
  description: Assign an owner for the deployment; review infrastructure and email-send spend monthly against budget.
