openapi: 3.2.0
info:
  title: Listmonk Lists API
  version: '1.0'
  description: 'Operations tagged Lists across 2 of this provider''s published API definitions: listmonk-collections-openapi.yml, listmonk-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- description: Listmonk Developement Server
  url: http://localhost:9000/api
- url: '{host}/api'
  description: Self-hosted instance
  variables:
    host:
      default: http://localhost:9000
      description: Base URL of your listmonk instance
tags:
- name: Lists
  description: Subscriber List API
  externalDocs:
    url: https://listmonk.app/docs/apis/lists/
paths:
  /lists:
    get:
      description: retrieves lists with additional metadata like subscriber counts. This may be slow.
      operationId: getLists
      tags:
      - Lists
      parameters:
      - in: query
        name: page
        description: total number of pages
        required: false
        schema:
          type: integer
      - in: query
        name: per_page
        description: number of items per page
        required: false
        schema:
          oneOf:
          - type: integer
            description: Number of items to return per page
          - type: string
            enum:
            - all
            description: Return all results without pagination
      - in: query
        name: query
        description: Optional string to search a list by name.
        required: false
        schema:
          type: string
      - in: query
        name: order_by
        description: Field to sort results by. name|status|created_at|updated_at
        required: false
        schema:
          type: string
          enum:
          - name
          - status
          - created_at
          - updated_at
      - in: query
        name: order
        description: ASC|DESC Sort by ascending or descending order.
        required: false
        schema:
          type: string
          enum:
          - ASC
          - DESC
      - in: query
        name: minimal
        description: When set to true, returns response without body content
        required: false
        schema:
          type: boolean
      - in: query
        name: tag
        description: Tags to filter lists. Repeat in the query for multiple values.
        required: false
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: list of metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      results:
                        type: array
                        items:
                          $ref: '#/components/schemas/List'
                      total:
                        type: integer
                      per_page:
                        type: integer
                      page:
                        type: integer
      summary: Get lists
      x-summary-source: derived
    post:
      description: handles list creation
      operationId: createList
      tags:
      - Lists
      requestBody:
        description: new list info
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewList'
      responses:
        '200':
          description: updated list object
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/List'
      summary: Create list
      x-summary-source: derived
    delete:
      operationId: deleteLists
      tags:
      - Lists
      summary: Delete multiple lists by ID
      parameters:
      - name: id
        in: query
        schema:
          type: array
          items:
            type: integer
      responses:
        '200':
          description: Deletion result.
    servers:
    - description: Listmonk Developement Server
      url: http://localhost:9000/api
  /lists/{list_id}:
    get:
      description: retrieves lists with additional metadata like subscriber counts. This may be slow.
      operationId: getListById
      tags:
      - Lists
      parameters:
      - in: path
        name: list_id
        required: true
        description: The id value of the list you want to retreive.
        schema:
          type: integer
      responses:
        '200':
          description: list object
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/List'
      summary: Get list by id
      x-summary-source: derived
    put:
      description: handles list modification
      operationId: updateListById
      tags:
      - Lists
      parameters:
      - in: path
        name: list_id
        required: true
        description: The id value of the list you want to update
        schema:
          type: integer
      requestBody:
        description: updated list field values
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/List'
      responses:
        '200':
          description: updated list object
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/List'
      summary: Update list by id
      x-summary-source: derived
    delete:
      description: handles list deletion, either a single one (ID in the URI), or a list.
      operationId: deleteListById
      tags:
      - Lists
      parameters:
      - in: path
        name: list_id
        required: true
        description: The id value of the lists you want to delete.
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: boolean
      summary: Delete list by id
      x-summary-source: derived
    parameters:
    - name: list_id
      in: path
      required: true
      schema:
        type: integer
    servers:
    - description: Listmonk Developement Server
      url: http://localhost:9000/api
  /public/lists:
    get:
      operationId: getPublicLists
      tags:
      - Lists
      summary: Retrieve public lists (unauthenticated, for subscription forms)
      security: []
      responses:
        '200':
          description: Public lists.
    servers:
    - url: http://localhost:9000/api
      description: Default local self-hosted instance
    - url: '{host}/api'
      description: Self-hosted instance
      variables:
        host:
          default: http://localhost:9000
          description: Base URL of your listmonk instance
components:
  schemas:
    List:
      type: object
      properties:
        id:
          type: integer
        created_at:
          type: string
        updated_at:
          type: string
        uuid:
          type: string
        name:
          type: string
        type:
          type: string
        optin:
          type: string
        tags:
          type: array
          items:
            type: string
        subscriber_count:
          type: integer
        description:
          type: string
    NewList:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
          enum:
          - public
          - private
        optin:
          type: string
          enum:
          - single
          - double
        tags:
          type: array
          items:
            type: string
        description:
          type: string
    List_2:
      type: object
      properties:
        id:
          type: integer
        uuid:
          type: string
        name:
          type: string
        type:
          type: string
        optin:
          type: string
        tags:
          type: array
          items:
            type: string
        subscriber_count:
          type: integer
        created_at:
          type: string
          format: date-time
    ListResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/List_2'
    ListRequest:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
          enum:
          - public
          - private
        optin:
          type: string
          enum:
          - single
          - double
        tags:
          type: array
          items:
            type: string
        description:
          type: string
      required:
      - name
    ListsResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            results:
              type: array
              items:
                $ref: '#/components/schemas/List_2'
            total:
              type: integer
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
      description: HTTP Basic auth using an API user name and token (api_user:token).
    TokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: 'Authorization header in the form: token api_user:token.'
x-refined-from:
- listmonk-collections-openapi.yml
- listmonk-openapi.yml
