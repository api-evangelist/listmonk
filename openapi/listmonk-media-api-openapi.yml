openapi: 3.2.0
info:
  title: Listmonk Media API
  version: '1.0'
  description: 'Operations tagged Media across 2 of this provider''s published API definitions: listmonk-collections-openapi.yml, listmonk-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- description: Listmonk Developement Server
  url: http://localhost:9000/api
- url: '{host}/api'
  description: Self-hosted instance
  variables:
    host:
      default: http://localhost:9000
      description: Base URL of your listmonk instance
tags:
- name: Media
  description: Media API
  externalDocs:
    url: https://listmonk.app/docs/apis/media/
paths:
  /media:
    get:
      description: handles retrieval of uploaded media.
      operationId: getMedia
      tags:
      - Media
      responses:
        '200':
          description: response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MediaFileObject'
      summary: Get media
      x-summary-source: derived
    post:
      description: handles media file uploads.
      operationId: uploadMedia
      tags:
      - Media
      requestBody:
        description: upload media file
        content:
          multipart/form-data:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/MediaFileObject'
      summary: Upload media
      x-summary-source: derived
    servers:
    - description: Listmonk Developement Server
      url: http://localhost:9000/api
  /media/{id}:
    get:
      description: handles retrieval of uploaded media.
      operationId: getMediaById
      tags:
      - Media
      parameters:
      - in: path
        name: id
        required: true
        description: media file id
        schema:
          type: integer
      responses:
        '200':
          description: response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/MediaFileObject'
      summary: Get media by id
      x-summary-source: derived
    delete:
      description: handles deletion of uploaded media.
      operationId: deleteMediaById
      tags:
      - Media
      parameters:
      - in: path
        name: id
        required: true
        description: The id value of the list you want to delete.
        schema:
          type: integer
      responses:
        '200':
          description: response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: boolean
      summary: Delete media by id
      x-summary-source: derived
    servers:
    - description: Listmonk Developement Server
      url: http://localhost:9000/api
  /media/{media_id}:
    parameters:
    - name: media_id
      in: path
      required: true
      schema:
        type: integer
    get:
      operationId: getMediaFile
      tags:
      - Media
      summary: Retrieve a specific media file
      responses:
        '200':
          description: The media file.
      security:
      - BasicAuth: []
      - TokenAuth: []
    delete:
      operationId: deleteMedia
      tags:
      - Media
      summary: Delete an uploaded media file
      responses:
        '200':
          description: Deletion result.
      security:
      - BasicAuth: []
      - TokenAuth: []
    servers:
    - url: http://localhost:9000/api
      description: Default local self-hosted instance
    - url: '{host}/api'
      description: Self-hosted instance
      variables:
        host:
          default: http://localhost:9000
          description: Base URL of your listmonk instance
components:
  schemas:
    MediaFileObject:
      type: object
      properties:
        id:
          type: integer
        uuid:
          type: string
        filename:
          type: string
        content_type:
          type: string
        created_at:
          type: string
        thumb_url:
          type: string
        thumb_uri:
          type: string
        provider:
          type: string
        meta:
          type: object
        url:
          type: string
        uri:
          type: string
    Media:
      type: object
      properties:
        id:
          type: integer
        uuid:
          type: string
        filename:
          type: string
        content_type:
          type: string
        url:
          type: string
        thumb_url:
          type: string
        created_at:
          type: string
          format: date-time
    MediaResponse:
      type: object
      properties:
        data:
          oneOf:
          - $ref: '#/components/schemas/Media'
          - type: array
            items:
              $ref: '#/components/schemas/Media'
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
      description: HTTP Basic auth using an API user name and token (api_user:token).
    TokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: 'Authorization header in the form: token api_user:token.'
x-refined-from:
- listmonk-collections-openapi.yml
- listmonk-openapi.yml
