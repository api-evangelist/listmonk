description: >-
  listmonk publishes no CHANGELOG.md and no changelog page on listmonk.app. Its
  dated change record is the GitHub Releases feed, where every versioned release
  carries a written "What's new" section, a security section when applicable, an
  upgrade procedure, and a commit-level changelog. That is a real, dated,
  human-readable changelog — it is simply hosted on GitHub rather than on the
  project's own domain. API-affecting changes are called out inline (new
  endpoints, new permissions, breaking template changes) but are not separated
  from application changes.
