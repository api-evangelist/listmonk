  - version: v6.1.0
    date: '2026-03-29'
    security: true
    breaking: false
    api_changes:
      - Added PATCH /api/subscribers/:id for partial subscriber updates.
      - >-
        Added the granular `campaigns:send` permission, split out from
        campaign manage permissions — an existing API user with
        `campaigns:manage_all` can no longer send a campaign without it.
    highlights:
      - Fixes for multiple campaign/list permission validation issues in multi-user environments.
      - New global Privacy setting to disable view and click tracking.
      - Ability to proxy S3 media files through listmonk instead of linking to S3 directly.
      - Lettermint bounce webhook provider.
      - Duplicate button in the visual e-mail builder block options.
  - version: v6.0.0
    date: '2026-01-02'
    breaking: true
    api_changes:
      - Transactional mails can now be sent to non-subscribers via POST /api/tx.
      - Campaign-level JSON attributes, mirroring subscriber attribs.
    highlights:
      - TOTP two-factor authentication.
      - E-mail-based "Forgot password" reset flow.
      - Ability to archive lists.
      - Subscriber activity in the subscriber profile UI.
      - Granular override on subscriptions / subscriber profile in bulk import.
      - In-built Postgres VACUUM cron in Maintenance settings.
      - CORS origin configuration in Security settings.
