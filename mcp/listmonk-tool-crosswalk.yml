description: >-
  Binds every tool exposed by the community listmonk MCP server to the listmonk
  REST operation(s) that back it. Mapping is by name and semantics: the MCP
  server is stdio-only, so a live tools/list introspection was not possible and
  no inputSchema could be read off the wire. Where the binding is unambiguous
  (one tool, one operationId, matching verb and resource) confidence is high;
  where the tool composes or fans out over several operations it is medium or
  low and the note says why. NOTE the crosswalk is against a THIRD-PARTY server
  — see mcp/listmonk-mcp.yml — so `mcp_only` rows describe conveniences that
  server author added, not capabilities listmonk ships.
