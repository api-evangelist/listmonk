generated: '2026-08-13'
method: searched
source: https://listmonk.app/docs/apis/sdks/
description: >-
  listmonk ships NO first-party MCP server. It does link one from its own
  community SDK directory — `listmonk-mcp` by Rahul Verma (rhnvrm) — under an
  explicit disclaimer that the listed projects "have not been verified and are
  not officially supported". That server is a Python package run over local
  stdio; there is no hosted endpoint an agent can POST to, and there could not
  be, because listmonk is self-hosted software with no vendor-operated API host.
  The tool inventory below was read from the server's source
  (src/listmonk_mcp/server.py at rhnvrm/listmonk-mcp@master) on 2026-08-13, not
  from a live tools/list call — a stdio server cannot be introspected over HTTP.
official: false
status: community
deployment:
  mode: local-stdio
  endpoint: null
  install: uvx listmonk-mcp
  package: https://pypi.org/project/listmonk-mcp/
  auth: api-key
  verified: searched
  note: >-
    `pip install listmonk-mcp` is the documented alternative. Auth is the
    operator's own listmonk API user + token, supplied via environment variables
    pointing the server at their self-hosted instance. mode is local-stdio, NOT
    remote: nothing here is reachable by an agent without a human first
    installing the package and pointing it at a listmonk deployment.
