method: derived
source: >-
  openapi/_original/listmonk-collections-openapi.yml ,
  https://listmonk.app/docs/apis/apis/ , https://listmonk.app/docs/oidc/ ,
  https://listmonk.app/docs/roles-and-permissions/ , and live probes of
