description: >-
  listmonk ships no first-party client libraries. The project distributes exactly
  one official artifact — the single `listmonk` Go binary (and its Docker image) —
  and maintains a community SDK directory on its own docs site at
  /docs/apis/sdks/, where it states plainly: "The list is community sourced. They
  have not been verified and are not officially supported." Every client library
  below is therefore recorded with `official: false`. Registry versions and
  publish dates were read from the public registry metadata endpoints on
  2026-08-13.
summary:
  official_packages: 1
  community_packages: 12
  official_sdk_count: 0
  note: >-
    Because no client SDK is first-party, this artifact deliberately does NOT
    carry a `SDKs` pointer in apis.yml — asserting one would credit listmonk with
    SDKs it neither writes nor supports.
