cross_cutting_rules:
  - No idempotency key on any endpoint. Retries are real repeats; deduplicate client-side.
  - Auth failure returns HTTP 403 with {"message":"invalid session"}, not 401, and no WWW-Authenticate.
  - Errors are prose in a `message` field; no machine-readable code, no RFC 9457.
  - Success is {"data": ...}; preview endpoints return text/html instead.
  - No RateLimit-*, X-RateLimit-* or Retry-After headers; 429 is documented but unsignalled.
  - Admin API uses integer ids; the public and webhook surfaces use UUIDs.
  - Authorization is RBAC — the right token with the wrong permission fails just like a bad token.
