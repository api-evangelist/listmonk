description: >-
  listmonk is free and open-source software released under the AGPLv3 license.
  There is no hosted SaaS and no paid tiers from the project itself - users
  self-host the single Go binary (plus a PostgreSQL database) on their own
  infrastructure at no license cost. The only costs are the infrastructure to
  run it (server, database, object storage) and the outbound email transport
  (any SMTP provider such as Amazon SES, SendGrid, Postal, or a self-run MTA),
  all of which are billed by those third parties, not by listmonk.
notes: >-
  listmonk does not sell licenses, subscriptions, or a managed cloud. Any
  hosting plans (e.g. one-click marketplace images) are offered by third-party
  platforms, not by the listmonk project.
sources:
- https://listmonk.app
