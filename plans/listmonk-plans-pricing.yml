plans:
- id: listmonk-oss
  name: Open Source (Self-Hosted)
  type: free
  description: >-
    Full-featured, self-hosted newsletter and mailing-list manager under the
    AGPLv3 license. No license fee, no usage caps imposed by the software, and
    full access to the REST API. Operator pays only for their own
    infrastructure and email transport.
