  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://listmonk.app/docs/apis/templates/
  baseURL: http://localhost:9000/api
  properties:
  - url: https://listmonk.app/docs/apis/templates/
    type: Documentation
  - url: openapi/listmonk-openapi.yml
    type: OpenAPI
  description: Manage campaign and transactional message templates - create, retrieve,
    update, delete, set a default, and render HTML previews of Go-templated email
    bodies.
- aid: listmonk:listmonk-media-api
  name: listmonk Media API
  tags:
  - Media
  - Uploads
  - Files
