name: listmonk
kind: company
description: listmonk is a free and open-source, self-hosted newsletter and mailing-list manager built
  in Go with a Vue front end. Every feature in the admin UI is backed by a documented REST API on the
  self-hosted instance (Basic auth with an API user and token) covering subscribers, lists, campaigns,
  templates, media, CSV import, transactional messages, and bounces. There is no hosted SaaS - users run
  their own instance.
