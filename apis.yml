- aid: listmonk:listmonk-import-bounces-api
  name: listmonk Import and Bounces API
  tags:
  - Import
  - Bounces
  - Deliverability
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://listmonk.app/docs/apis/import/
  baseURL: http://localhost:9000/api
  properties:
  - url: https://listmonk.app/docs/apis/import/
    type: Documentation
  - url: https://listmonk.app/docs/apis/bounces/
    type: Documentation
  - url: openapi/listmonk-openapi.yml
    type: OpenAPI
  description: Bulk import subscribers from a CSV (optionally ZIP-compressed) file
    and monitor or stop the running import, plus retrieve and delete bounce records
    used to maintain sender reputation.
