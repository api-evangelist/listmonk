aid: listmonk
url: https://raw.githubusercontent.com/api-evangelist/listmonk/refs/heads/main/apis.yml
name: listmonk
kind: company
description: listmonk is a free and open-source, self-hosted newsletter and mailing-list
  manager built in Go with a Vue front end. Every feature in the admin UI is backed
  by a documented REST API on the self-hosted instance (Basic auth with an API
  user and token) covering subscribers, lists, campaigns, templates, media, CSV
  import, transactional messages, and bounces. There is no hosted SaaS - users
  run their own instance.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Email
- Newsletter
- Mailing List
- Open Source
- Self-Hosted
created: '2026-06-25'
modified: '2026-06-25'
specificationVersion: '0.19'
apis:
- aid: listmonk:listmonk-subscribers-api
  name: listmonk Subscribers API
  tags:
  - Subscribers
  - Contacts
  - Lists
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://listmonk.app/docs/apis/subscribers/
  baseURL: http://localhost:9000/api
  properties:
  - url: https://listmonk.app/docs/apis/subscribers/
    type: Documentation
  - url: https://listmonk.app/docs/apis/apis/
    type: APIReference
  - url: openapi/listmonk-openapi.yml
    type: OpenAPI
  description: Create, query, update, blocklist, and delete subscribers, manage their
    list memberships individually or in bulk via SQL query expressions, and export
    subscriber data. Self-hosted endpoints secured with Basic auth (api_user:token).
- aid: listmonk:listmonk-lists-api
  name: listmonk Lists API
  tags:
  - Lists
  - Mailing Lists
  - Segmentation
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://listmonk.app/docs/apis/lists/
  baseURL: http://localhost:9000/api
  properties:
  - url: https://listmonk.app/docs/apis/lists/
    type: Documentation
  - url: openapi/listmonk-openapi.yml
    type: OpenAPI
  description: Create, retrieve, update, and delete mailing lists (single and double
    opt-in, public and private), with a public unauthenticated endpoint for surfacing
    subscribable lists on subscription forms.
- aid: listmonk:listmonk-campaigns-api
  name: listmonk Campaigns API
  tags:
  - Campaigns
  - Email
  - Analytics
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://listmonk.app/docs/apis/campaigns/
  baseURL: http://localhost:9000/api
  properties:
  - url: https://listmonk.app/docs/apis/campaigns/
    type: Documentation
  - url: openapi/listmonk-openapi.yml
    type: OpenAPI
  description: Create, schedule, test, preview, and send email campaigns to one or
    more lists, change campaign status, publish to a public archive, and pull running
    stats and view/click/bounce analytics.
- aid: listmonk:listmonk-templates-api
  name: listmonk Templates API
